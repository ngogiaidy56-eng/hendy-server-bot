name: Deploy Cloudflare Worker and Telegram Mini App

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "d1/**"
      - "mini-app/**"
      - "wrangler.toml"
      - "wrangler.pages.toml"
      - "package.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      HENDY_INTERNAL_API_TOKEN: ${{ secrets.HENDY_INTERNAL_API_TOKEN }}
      VITE_API_BASE_URL: ${{ secrets.RENDER_PUBLIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || (echo "Missing CLOUDFLARE_D1_DATABASE_ID" && exit 1)
          test -n "$HENDY_INTERNAL_API_TOKEN" || (echo "Missing HENDY_INTERNAL_API_TOKEN" && exit 1)
          test -n "$VITE_API_BASE_URL" || (echo "Missing RENDER_PUBLIC_URL" && exit 1)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure D1 binding
        run: node scripts/prepare-cloudflare-config.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply hendy-bot-data --remote

      - name: Set Data Worker internal API secret
        shell: bash
        run: printf '%s' "$HENDY_INTERNAL_API_TOKEN" | npx wrangler secret put HENDY_INTERNAL_API_TOKEN --config wrangler.toml

      - name: Deploy Cloudflare Data Worker
        run: npx wrangler deploy --config wrangler.toml

      - name: Build Telegram Mini App
        run: npm run build:miniapp

      - name: Deploy Telegram Mini App to Pages
        run: npx wrangler pages deploy mini-app/dist --project-name hendy-bot-mini-app --branch main --config wrangler.pages.toml
