name = "hendy-bot-data"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "hendy-bot-data"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "d1/migrations"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "hendy-bot-assets"

[vars]
APP_ENV = "production"

[triggers]
crons = ["0 3 * * *"]
